<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<title>Dr IT POS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#eef2f7;}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0d47a1,#42a5f5);
}

.box{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  padding:20px;
  width:320px;
  border-radius:12px;
  text-align:center;
  color:#fff;
}

.title3d{
  font-size:22px;
  font-weight:bold;
  animation:rot 4s linear infinite;
  text-shadow:0 0 10px #00e5ff;
}

@keyframes rot{
  0%{transform:rotateY(0);}
  50%{transform:rotateY(180deg);}
  100%{transform:rotateY(360deg);}
}

input{width:100%;padding:8px;margin:5px 0;border:none;border-radius:6px;}
button{width:100%;padding:8px;margin-top:5px;border:none;border-radius:6px;background:#00e5ff;font-weight:bold;cursor:pointer;}

.app{display:none;padding:10px;}
.card{background:#fff;padding:10px;margin:8px 0;border-radius:10px;}

.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:5px;
  text-align:center;
}
</style>
</head>

<body>

<!-- SOUND -->
<audio id="loginSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a5c5f2.mp3?filename=success-1-6297.mp3">
</audio>

<!-- LOGIN -->
<div class="login" id="loginBox">
<div class="box">

<div class="title3d">دکتۆر ئایتی</div>

<input id="user">
<input id="pass" type="password">
<button onclick="login()">Login</button>

</div>
</div>

<!-- APP -->
<div class="app" id="app">

<h3>📦 Products</h3>

<input id="pname" placeholder="name">
<input id="pprice" placeholder="price">
<input id="pcost" placeholder="cost">
<input id="pstock" placeholder="stock">

<button onclick="addProduct()">Add</button>

<div id="plist"></div>

<hr>

<h3>🛒 Cart</h3>
<input id="customer" placeholder="customer">
<input id="phone" placeholder="phone">

<div id="cartBox"></div>

<button onclick="sell()">Sell</button>
<button onclick="pdf()">PDF</button>
<button onclick="sendWhatsAppAuto()">WhatsApp</button>

<hr>

<h3>🔎 Customer</h3>
<input id="search" onkeyup="searchCustomer()" placeholder="search">
<div id="customerBox"></div>

<hr>

<h3>💳 Credit</h3>
<button onclick="repayDebt()">Repay</button>
<button onclick="applyInterest()">Interest</button>

</div>

<!-- FOOTER -->
<div class="footer">
💵 Sales: <span id="sales">0</span> $
| 💰 Profit: <span id="profit">0</span> $
</div>

<script>

let users=[
  {u:"admin",p:"1122",role:"admin"},
  {u:"staff",p:"1234",role:"cashier"}
];

let currentUser=null;

let products=[];
let cart=[];
let customers={};
let invoices=[];

let sales=0;
let profit=0;

/* LOGIN */
function login(){

  currentUser=users.find(x=>x.u==user.value && x.p==pass.value);

  if(!currentUser){
    alert("error");
    return;
  }

  document.getElementById("loginSound").play();

  loginBox.style.display="none";
  app.style.display="block";

  render();
}

/* PRODUCT */
function addProduct(){
  if(currentUser.role!="admin") return alert("admin only");

  products.push({
    name:pname.value,
    price:+pprice.value,
    cost:+pcost.value,
    stock:+pstock.value
  });

  render();
}

/* ADD CART */
function addToCart(i){
  let p=products[i];
  let f=cart.find(x=>x.name==p.name);
  if(f) f.qty++; else cart.push({...p,qty:1});
  renderCart();
}

/* SELL */
function sell(){

  let name=customer.value;
  let phone=phone.value;

  let sale=0;
  let cost=0;

  cart.forEach(i=>{
    let p=products.find(x=>x.name==i.name);
    p.stock-=i.qty;

    sale+=i.price*i.qty;
    cost+=i.cost*i.qty;
  });

  sales+=sale;
  profit+=(sale-cost);

  if(!customers[name]){
    customers[name]={phone,debt:0};
  }

  customers[name].debt+=sale;

  invoices.push({
    customer:name,
    total:sale,
    debt:sale,
    paid:0,
    time:new Date().toLocaleString()
  });

  cart=[];
  render();
  renderCart();
}

/* REPAY */
function repayDebt(){
  let name=customer.value;
  let amount=+prompt("amount");

  customers[name].debt-=amount;
  if(customers[name].debt<0)customers[name].debt=0;
}

/* INTEREST */
function applyInterest(){
  invoices.forEach(i=>{
    if(i.debt>0) i.debt*=1.05;
  });
}

/* WHATSAPP */
function sendWhatsAppAuto(){

  let name=customer.value;
  let c=customers[name];

  let text="🧾 Invoice\n👤 "+name+"\n";

  cart.forEach(i=>{
    text+=i.name+" x"+i.qty+"\n";
  });

  let url="https://wa.me/"+c.phone+"?text="+encodeURIComponent(text);

  window.open(url);
}

/* SEARCH */
function searchCustomer(){

  let q=search.value.toLowerCase();

  customerBox.innerHTML="";

  Object.keys(customers).forEach(n=>{

    if(n.toLowerCase().includes(q)){
      customerBox.innerHTML+=`
        <div class="card">
          👤 ${n}<br>
          💳 ${customers[n].debt}$
        </div>
      `;
    }
  });
}

/* RENDER */
function render(){

  plist.innerHTML="";

  products.forEach((p,i)=>{
    plist.innerHTML+=`
      <div class="card">
        ${p.name} ${p.price}$
        <button onclick="addToCart(${i})">+</button>
      </div>
    `;
  });
}

function renderCart(){
  cartBox.innerHTML="";
  let total=0;

  cart.forEach(i=>{
    total+=i.price*i.qty;
    cartBox.innerHTML+=`
      <div class="card">${i.name} x${i.qty}</div>
    `;
  });

  salesSpan.innerText=sales;
  profitSpan.innerText=profit;
}

/* PDF */
function pdf(){
  const {jsPDF}=window.jspdf;
  let doc=new jsPDF();
  doc.text("Invoice",10,10);
  doc.save("invoice.pdf");
}

</script>

</body>
</html>
